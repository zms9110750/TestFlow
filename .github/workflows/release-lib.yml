# 正式版发布：手动触发，把指定的 lib 以指定版本推到 GitHub Packages。
# 用途：先发一个"正式版本"出来当基线 —— preview-libs.yml 的 API 对比需要有东西可比，
#       否则每次都会走"找不到基线 → 按无变化 → 涨 Z"那条分支。
# CI 里推送用内置的 GITHUB_TOKEN（不需要个人 PAT）。
name: Release lib

on:
  workflow_dispatch:
    inputs:
      projects:
        description: '要发布的 lib，逗号分隔的 csproj 路径（留空 = src 下全部）'
        required: false
        type: string
      version:
        description: '正式版本号，例如 0.1.0（留空 = 用项目里 <Version> 写的值）'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.pick.outputs.libs }}
    steps:
      - uses: actions/checkout@v4

      - name: 决定发哪几个 lib
        id: pick
        shell: pwsh
        run: |
          $pick = "${{ inputs.projects }}".Trim()
          if ($pick) {
            $list = @($pick.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          } else {
            $root = (Get-Location).Path
            $list = @(Get-ChildItem src -Recurse -Filter *.csproj |
                      ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') })
          }
          $json = ConvertTo-Json -InputObject @($list) -Compress
          Write-Host "将发布: $($list -join ', ')"
          "libs=$json" >> $env:GITHUB_OUTPUT

  publish:
    needs: resolve
    if: needs.resolve.outputs.libs != '[]' && needs.resolve.outputs.libs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.resolve.outputs.libs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 登录 GitHub Packages
        shell: pwsh
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name github --username "${{ github.actor }}" `
            --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: 决定版本号
        id: ver
        shell: pwsh
        run: |
          $in = "${{ inputs.version }}".Trim()
          if ($in) {
            $v = $in
          } else {
            # 留空就用项目里 <Version> 写的那个
            $v = (dotnet msbuild "${{ matrix.project }}" -getProperty:Version | ConvertFrom-Json).Properties.Version
          }
          Write-Host "版本 = $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 打包（正式版，不带 -ci.N）
        shell: pwsh
        run: |
          dotnet pack "${{ matrix.project }}" -c Release -o out `
            -p:Version="${{ steps.ver.outputs.version }}"

      - name: 推送到 GitHub Packages
        shell: pwsh
        run: |
          dotnet nuget push "out/*.nupkg" --source github `
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
